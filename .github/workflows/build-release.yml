name: Build and release desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Check email literals
        run: ./scripts/lint-email-literals.sh

  version:
    name: Select release version
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select tag
        id: version
        shell: bash
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag=$GITHUB_REF_NAME
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # Reuse this commit's tag on retries; otherwise increment the latest patch.
            stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
            tag=$(git tag --points-at "$GITHUB_SHA" --sort=-v:refname | { grep -E "$stable" || true; } | sed -n '1p')
            if [[ -z "$tag" ]]; then
              latest=$(git tag --sort=-v:refname | { grep -E "$stable" || true; } | sed -n '1p')
              latest=${latest:-v0.0.0}
              IFS=. read -r major minor patch <<< "${latest#v}"
              tag="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  package:
    name: Package beta desktop binaries
    needs: version
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MACOS_ADHOC_SIGN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Set artifact version
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            tag=$RELEASE_TAG
            semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
            if [[ ! "$tag" =~ $semver ]]; then
              echo "Release tags must use SemVer, for example v1.2.3 or v1.2.3-rc.1" >&2
              exit 1
            fi
            version=${tag#v}
          else
            version=ci-${GITHUB_SHA::12}
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Build portable archives
        run: ./scripts/package-desktop.sh
      - name: Verify checksums
        run: cd dist && shasum -a 256 --check SHA256SUMS
      - name: Verify ad-hoc macOS signatures
        shell: bash
        run: |
          for archive in dist/gclean-*-darwin-*.tar.gz; do
            work=$(mktemp -d)
            tar -xzf "$archive" -C "$work"
            codesign --verify --strict --verbose=2 "$work/gclean"
            codesign -dv --verbose=2 "$work/gclean" 2>&1 | grep -F 'Signature=adhoc'
          done
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gclean-desktop-${{ env.VERSION }}
          path: |
            dist/gclean-*.tar.gz
            dist/gclean-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: [version, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: gclean-desktop-*
          path: dist
          merge-multiple: true
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          # Publish in this run: tags created by GITHUB_TOKEN do not trigger workflows.
          # Create-only reservation: a competing tag must never be overwritten.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" >/dev/null 2>&1 || true
          remote_commit=$(gh api "repos/$GH_REPO/commits/refs/tags/$RELEASE_TAG" --jq '.sha')
          if [[ "$remote_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag belongs to another commit; refusing to replace its assets." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --prerelease \
              --title "gclean $RELEASE_TAG"
          fi
