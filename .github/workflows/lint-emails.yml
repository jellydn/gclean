name: Lint email literals

# Rejects raw `local@domain.tld` literals anywhere in non-test *.go / *.json
# source. Cloudflare's email-obfuscation pass silently rewrites any literal
# matching the email regex into the placeholder "[email protected]" (no "@"),
# which breaks downstream domain extraction and equality checks. The defense
# is engine.MkEmail(local, domain) — see .plans/implement-notes.md.
#
# This CI runs on every push and pull_request so offenders can't silently land.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-email-literals:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run email-literal lint
        run: ./scripts/lint-email-literals.sh
